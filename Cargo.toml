[package]
name = "opentelemetry-detector-ecs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "An OpenTelemetry resource detector for Amazon ECS."
repository = "https://github.com/DeterminateSystems/opentelemetry-detector-ecs"
documentation = "https://docs.rs/opentelemetry-detector-ecs"
readme = "README.md"
keywords = ["opentelemetry", "ecs", "aws", "observability", "tracing"]
categories = ["development-tools::debugging", "development-tools::profiling"]

# The code never names aws-smithy-http-client; the dependency exists for the
# `fips` feature to forward to.
[package.metadata.cargo-machete]
ignored = ["aws-smithy-http-client"]

[features]
# Serve every HTTPS request with FIPS-validated crypto. The feature swaps the
# SDK clients' TLS stack onto aws-lc-fips-sys, and because Cargo builds one
# aws-lc-rs for the whole binary, every aws-lc caller gets the FIPS module.
# Building it takes cmake, go, and perl, plus clang on Linux.
fips = ["aws-smithy-http-client/rustls-aws-lc-fips"]

[dependencies]
arn = "0.1.0"
aws-config = { version = "1.10.1", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
# The SDK's default `rustls` feature selects a TLS stack a decade out of date,
# so each client takes `default-https-client` and nothing else.
aws-sdk-ecs = { version = "1.136.0", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-ssm = { version = "1.118.0", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
# Named only so the `fips` feature can reach it; the SDK clients above already
# pull it in through `default-https-client`.
aws-smithy-http-client = { version = "1.2.0" }
opentelemetry = { version = "0.32.0", default-features = false }
opentelemetry-semantic-conventions = { version = "0.32.1", features = [
  "semconv_experimental",
] }
opentelemetry_sdk = { version = "0.32.1", default-features = false }
regex = { version = "1.13.1", default-features = false }
reqwest = { version = "0.13.4", features = [
  "blocking",
  "json",
], default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.49.0", default-features = false, features = [
  "rt",
  "time",
] }

[dev-dependencies]
aws-smithy-mocks = "0.3.0"
tokio = { version = "1.49.0", default-features = false, features = ["macros"] }

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  # Checking, publishing, and announcing share a job, so the release does the
  # setup once.
  Release:
    runs-on: ubuntu-latest

    environment: crates.io

    permissions:
      contents: write # To open the GitHub release.
      id-token: write # To trade for a crates.io token.

    defaults:
      run:
        shell: nix develop --command bash -e {0}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@main

      - name: Check the tag against the manifest
        run: |
          manifest="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the manifest version $manifest"
            exit 1
          fi

      - name: Check
        run: just ci

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: just publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Announce the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

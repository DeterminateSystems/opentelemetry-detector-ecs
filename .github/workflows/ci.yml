name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Checks:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main

      - name: Check the Nixpkgs input
        uses: DeterminateSystems/flake-checker-action@main
        with:
          fail-mode: true

      - name: Nix formatting
        if: success() || failure()
        run: git ls-files '*.nix' | xargs nix develop --command nixfmt --check

      - name: EditorConfig
        if: success() || failure()
        run: git ls-files | xargs nix develop --command eclint

      - name: Spelling
        if: success() || failure()
        run: nix develop --command typos

      - name: Rust formatting
        if: success() || failure()
        run: nix develop --command cargo fmt --check

      - name: Clippy
        if: success() || failure()
        run: nix develop --command cargo clippy --all-targets --locked -- --deny warnings

      - name: Tests
        if: success() || failure()
        run: nix develop --command cargo test --locked

      - name: Rustdoc
        if: success() || failure()
        env:
          RUSTDOCFLAGS: --deny warnings
        run: nix develop --command cargo doc --no-deps --locked

      - name: Unused dependencies
        if: success() || failure()
        run: nix develop --command cargo machete

      # Catch a packaging mistake here rather than at the tag that publishes it.
      - name: Packaging
        if: success() || failure()
        run: nix develop --command cargo publish --dry-run --locked

  DeterminateCI:
    needs: Checks

    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@main

    permissions:
      contents: read
      id-token: write

    with:
      visibility: public

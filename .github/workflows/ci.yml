name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    # Mondays, so an advisory published over the weekend surfaces on Monday.
    - cron: "0 13 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job, one checkout, one toolchain. Every step below is a Justfile
  # recipe, so what CI runs is what `just ci` runs.
  Check:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: nix develop --command bash -e {0}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@main

      - name: Check the Nixpkgs input
        uses: DeterminateSystems/flake-checker-action@main
        with:
          fail-mode: true

      - name: Restore the Cargo directories
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Spelled out rather than deferred to `just ci`, so a failure names the
      # step that failed and the steps after it still run.
      - name: Nix formatting
        if: success() || failure()
        run: just nixfmt-check

      - name: EditorConfig
        if: success() || failure()
        run: just editorconfig

      - name: Spelling
        if: success() || failure()
        run: just spelling

      - name: Rust formatting
        if: success() || failure()
        run: just fmt-check

      - name: Clippy
        if: success() || failure()
        run: just clippy

      - name: Tests
        if: success() || failure()
        run: just test

      - name: Documentation
        if: success() || failure()
        run: just doc

      - name: Unused dependencies
        if: success() || failure()
        run: just unused

      - name: Advisories
        if: success() || failure()
        run: just audit

      # Catch a packaging mistake here rather than at the tag that publishes it.
      - name: Packaging
        if: success() || failure()
        run: just package

      # Last because these compile AWS-LC's FIPS module from source.
      - name: Clippy (FIPS)
        if: success() || failure()
        run: just clippy-fips

      - name: Tests (FIPS)
        if: success() || failure()
        run: just test-fips

  FlakeLock:
    if: github.event_name == 'schedule'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@main

      - uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: Update the flake lock
          pr-labels: dependencies

name: Update the flake lock

on:
  schedule:
    # Mondays, alongside the dependabot run.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Update:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@main

      - uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: Update the flake lock
          pr-labels: dependencies
